    nav {

        display: grid;
        grid-template-columns: repeat(2, 400px);
        justify-content: center;
        gap: 25px;
        margin: 30px auto;
    }

    .gallery img {
        width: 400px;
        height: 270px;
        object-fit: cover;
        border-radius: 5px;
    }

    footer {
        margin-top: 30px;
    }

    @media (max-width: 850px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
            padding: 10px;
        }

        .gallery img {
            width: 100%;
            height: auto;
        }
    }
</style>
